# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/tutorials/build-and-test-code/python

name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test_windows:
    name: pytest on windows
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Cache Downloaded Files
      id: cache-downloaded-files-windows
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: github.ref == 'refs/heads/main'
      with:
        path: '**/tests/pdf_cache/*'
        key: cache-downloaded-files-main-${{ github.run_id }}
        restore-keys: |
          cache-downloaded-files-main-
          cache-downloaded-files
        enableCrossOsArchive: true
    - name: Restore Downloaded Files
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: github.ref != 'refs/heads/main'
      with:
        path: '**/tests/pdf_cache/*'
        key: cache-downloaded-files-main-
        restore-keys: |
          cache-downloaded-files-main-
          cache-downloaded-files
        enableCrossOsArchive: true
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'
        allow-prereleases: true
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
    - name: Install requirements (Python 3.11+)
      run: |
        pip install -r requirements/ci-3.11.txt
    - name: Install cryptography
      run: |
        pip install cryptography
    - name: Install pypdf
      run: |
        pip install .
    - name: Prepare
      run: |
        python -c "from tests import download_test_pdfs; download_test_pdfs()"
    - name: Test with pytest
      run: |
        python -m pytest tests --cov=pypdf --cov-append -n auto -vv -p no:benchmark

  test_macos:
    name: pytest on macOS
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Cache Downloaded Files
      id: cache-downloaded-files-mac
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: github.ref == 'refs/heads/main'
      with:
        path: '**/tests/pdf_cache/*'
        key: cache-downloaded-files-main-${{ github.run_id }}
        restore-keys: |
          cache-downloaded-files-main-
          cache-downloaded-files
    - name: Restore Downloaded Files
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: github.ref != 'refs/heads/main'
      with:
        path: '**/tests/pdf_cache/*'
        key: cache-downloaded-files-main-
        restore-keys: |
          cache-downloaded-files-main-
          cache-downloaded-files
    - name: Setup Python (3.11+)
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'
        allow-prereleases: true
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
    - name: Install requirements (Python 3.11+)
      run: |
        pip install -r requirements/ci-3.11.txt
    - name: Install cryptography
      run: |
        pip install cryptography
    - name: Install OS dependencies
      run:
        brew install ghostscript jbig2dec poppler
    - name: Install pypdf
      run: |
        pip install .
    - name: Prepare
      run: |
        python -c "from tests import download_test_pdfs; download_test_pdfs()"
    - name: Test with pytest
      run: |
        python -m pytest tests --cov=pypdf --cov-append -n auto -vv -p no:benchmark

  tests:
    name: "pytest on ${{ matrix.python-version }} (crypto-lib: ${{ matrix.use-crypto-lib }})"
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-26.04' }}
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15', 'pypy3.11-7.3.23']
        use-crypto-lib: ['cryptography']
        include:
          - python-version: '3.9'
            use-crypto-lib: 'pycryptodome'
          - python-version: '3.9'
            use-crypto-lib: 'none'
    steps:
    - name: Update APT packages
      run:
        sudo apt-get update
    - name: Install APT dependencies
      run:
        sudo apt-get install ghostscript jbig2dec poppler-utils
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Cache Downloaded Files
      id: cache-downloaded-files
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: github.ref == 'refs/heads/main'
      with:
        path: '**/tests/pdf_cache/*'
        key: cache-downloaded-files-main-${{ github.run_id }}
        restore-keys: |
          cache-downloaded-files-main-
          cache-downloaded-files
    - name: Restore Downloaded Files
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: github.ref != 'refs/heads/main'
      with:
        path: '**/tests/pdf_cache/*'
        key: cache-downloaded-files-main-
        restore-keys: |
          cache-downloaded-files-main-
          cache-downloaded-files
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      if: matrix.python-version == '3.9' || matrix.python-version == '3.10'
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: '**/requirements/ci.txt'
    - name: Setup Python (3.11+)
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      if: matrix.python-version != '3.9' && matrix.python-version != '3.10'
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'
        cache-dependency-path: '**/requirements/ci-3.11.txt'
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
    - name: Install requirements (Python 3)
      run: |
        pip install -r requirements/ci.txt
      if: matrix.python-version == '3.9' || matrix.python-version == '3.10'
    - name: Install requirements (Python 3.11+)
      run: |
        pip install -r requirements/ci-3.11.txt
      if: matrix.python-version != '3.9' && matrix.python-version != '3.10'
    - name: Remove pycryptodome and cryptography
      run: |
        pip uninstall pycryptodome cryptography -y
    - name: Install cryptography
      run: |
        pip install cryptography
      if: matrix.use-crypto-lib == 'cryptography'
    - name: Install pycryptodome
      run: |
        pip install pycryptodome
      if: matrix.use-crypto-lib == 'pycryptodome'
    - name: Install pypdf
      run: |
        pip install .
    - name: Download test files
      run: |
        python -c "from tests import download_test_pdfs; download_test_pdfs()"
    - name: Test with pytest
      run: |
        python -m pytest tests --cov=pypdf --cov-append -n auto -vv -p no:benchmark
      if: ${{ !startsWith(matrix.python-version, 'pypy') }}
    - name: Test with pytest (PyPy, no coverage)
      # Coverage on PyPy is skipped because running coverage with PyPy is slow and CPython test already provides
      # complete coverage data for the same code
      run: |
        python -m pytest tests -n auto -vv -p no:benchmark -o faulthandler_timeout=60 --dist=loadfile
      if: ${{ startsWith(matrix.python-version, 'pypy') }}
    - name: Rename coverage data file
      run: mv .coverage ".coverage.$RANDOM"
      if: ${{ !startsWith(matrix.python-version, 'pypy') }}
    - name: Upload coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: ${{ !startsWith(matrix.python-version, 'pypy') }}
      with:
        name: coverage-data.${{ matrix.python-version }}-${{ matrix.use-crypto-lib }}
        path: .coverage.*
        if-no-files-found: ignore
        include-hidden-files: true

  pdfa_preservation:
    name: Validate PDF/A-1b document cloning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Setup Java
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install veraPDF 1.30.3
      run: |
        curl --fail --location --silent --show-error --retry 3 \
          https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.3-installer.zip \
          --output "$RUNNER_TEMP/verapdf-installer.zip"
        echo "b512bf24945503a33fc10738ecffc1f2dccaaf8593a448e94ee9ac86a9559a59  $RUNNER_TEMP/verapdf-installer.zip" | sha256sum --check -
        unzip -q "$RUNNER_TEMP/verapdf-installer.zip" -d "$RUNNER_TEMP"
        cat > "$RUNNER_TEMP/verapdf-install.xml" <<EOF
        <AutomatedInstallation langpack="eng">
          <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
          <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
            <installpath>$RUNNER_TEMP/verapdf</installpath>
          </com.izforge.izpack.panels.target.TargetPanel>
          <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
            <pack index="0" name="veraPDF GUI" selected="false"/>
            <pack index="1" name="veraPDF CLI" selected="true"/>
            <pack index="2" name="veraPDF Documentation" selected="false"/>
            <pack index="3" name="veraPDF Sample Plugins" selected="false"/>
          </com.izforge.izpack.panels.packs.PacksPanel>
          <com.izforge.izpack.panels.install.InstallPanel id="install"/>
          <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
        </AutomatedInstallation>
        EOF
        java -Xmx1536m -jar "$RUNNER_TEMP/verapdf-greenfield-1.30.3/verapdf-izpack-installer-1.30.3.jar" "$RUNNER_TEMP/verapdf-install.xml"
        "$RUNNER_TEMP/verapdf/verapdf" --version
    - name: Install pypdf
      run: python -m pip install .
    - name: Check source and cloned PDF/A-1b with veraPDF
      env:
        JAVA_TOOL_OPTIONS: '-Xmx1536m'
      run: |
        python - <<'PY'
        import os
        import subprocess
        import sys
        import xml.etree.ElementTree as ET
        from pathlib import Path

        from pypdf import PdfWriter

        original = Path("sample-files/021-pdfa/crazyones-pdfa.pdf")
        directory = Path(os.environ["RUNNER_TEMP"])
        validator = directory / "verapdf" / "verapdf"

        def is_compliant(path):
            result = subprocess.run(
                [str(validator), "--flavour", "1b", "--format", "xml", str(path)],
                capture_output=True,
                text=True,
                check=False,
            )
            (directory / f"{path.stem}.verapdf.xml").write_text(result.stdout, encoding="utf-8")
            try:
                report = ET.fromstring(result.stdout)
            except ET.ParseError as error:
                print(f"{path}: veraPDF returned invalid XML: {error}", file=sys.stderr)
                print(result.stderr, file=sys.stderr)
                return False

            jobs = report.findall("./jobs/job")
            validation = report.find("./jobs/job/validationReport")
            summary = report.find("./batchSummary")
            reports = summary.find("validationReports") if summary is not None else None
            ok = (
                result.returncode == 0
                and len(jobs) == 1
                and validation is not None
                and validation.get("jobEndStatus") == "normal"
                and validation.get("profileName") == "PDF/A-1b validation profile"
                and validation.get("isCompliant") == "true"
                and summary is not None
                and summary.get("totalJobs") == "1"
                and summary.get("failedToParse") == "0"
                and summary.get("veraExceptions") == "0"
                and reports is not None
                and reports.get("failedJobs") == "0"
                and reports.get("compliant") == "1"
            )
            print(f"{path}: veraPDF PDF/A-1b isCompliant={validation.get('isCompliant') if validation is not None else 'missing'}")
            if not ok:
                print(f"veraPDF exit status: {result.returncode}; {result.stderr}", file=sys.stderr)
                if validation is not None:
                    for rule in validation.findall("./details/rule[@status='failed']"):
                        print(f"Rule {rule.get('clause')}/{rule.get('testNumber')}: {rule.findtext('description')}", file=sys.stderr)
                        for check in rule.findall("./check[@status='failed']")[:3]:
                            print(f"  {check.findtext('context')}: {check.findtext('errorMessage')}", file=sys.stderr)
            return ok

        if not is_compliant(original):
            sys.exit("Source sample is not PDF/A-1b compliant")

        clone = directory / "pypdf-1012-clone.pdf"
        PdfWriter(clone_from=original).write(clone)
        if not is_compliant(clone):
            sys.exit("PdfWriter clone is not PDF/A-1b compliant")
        PY

  codestyle:
    name: Check code style issues
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: '**/requirements/ci-3.11.txt'
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
    - name: Install requirements
      run: |
        pip install -r requirements/ci-3.11.txt
    - name: Install pypdf
      run: |
        pip install .
    - name: Test with ruff
      run: |
        echo `ruff --version`
        ruff check .
    - name: Test with mypy
      run : |
        mypy .
    - name: Install docs requirements
      run: |
        pip install -r requirements/docs.txt
    - name: Test docs build
      working-directory: ./docs
      run: |
        sphinx-build --nitpicky --fail-on-warning --keep-going --show-traceback -d _build/doctrees --builder html . _build/html
    - name: Test docs examples
      working-directory: ./docs
      run: |
        sphinx-build -d _build/doctrees --builder doctest . _build/doctest
    - name: Check with pre-commit
      run: |
        pip install -r requirements/dev.txt
        pre-commit run --all-files --show-diff-on-failure

  package:
    name: Build & verify package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - run: python -m pip install flit check-wheel-contents
      - run: flit build
      - run: ls -l dist

      - name: Test CHANGELOG.md present in sdist
        run: tar -tzf dist/*.tar.gz | grep -q 'CHANGELOG.md'

      - name: Test of bdist
        run: check-wheel-contents dist/*.whl

      - name: Test installing package
        run: python -m pip install .

      - name: Test running installed package
        working-directory: /tmp
        run: python -c "import pypdf;print(pypdf.__version__)"

  coverage:
    name: Combine & check coverage.
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - run: python -m pip install --upgrade coverage[toml]

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-data*
          merge-multiple: true

      - name: Check Number of Downloaded Files
        run: |
          downloaded_files_count=$(find \.coverage* -type f | wc -l)
          if [ $downloaded_files_count -eq 9 ]; then
            echo "The expected number of files (9) were downloaded."
          else
            echo "ERROR: Expected 9 files, but found $downloaded_files_count files."
            exit 1
          fi

      - name: Combine coverage & create xml report
        run: |
          python -m coverage combine
          python -m coverage xml
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
