name: 'GitHub Pages Check'
on:
  workflow_dispatch:
  schedule:
    - cron: 0 6 * * 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  url-check:
    name: GitHub Pages check
    runs-on: ubuntu-latest
    steps:
      # The pages are maintained in docs/benchmark-page/ on main; benchmark.yaml copies them to gh-pages.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'
      - name: Check GitHub Pages
        run: |
          python .github/scripts/check_gh_pages_updates.py docs/benchmark-page
