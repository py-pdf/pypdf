name: Benchmarking pypdf
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  benchmark:
    name: "Benchmark ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.x']
        include:
          - python-version: '3.x'
            name: 'CPython'
          - python-version: 'pypy3.12'
            name: 'PyPy'
    permissions:
      contents: write  # Write the results to the branch.
      deployments: write  # Trigger GitHub pages deployment.
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install requirements
      run: |
        pip install -r requirements/ci-3.11.txt
    - name: Install pypdf
      run: |
        pip install .
    - name: Run benchmark
      run: |
        pytest tests/bench.py --benchmark-json output.json
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
      with:
        name: "${{ matrix.name }} Benchmark"
        tool: 'pytest'
        output-file-path: output.json
        # Use personal access token instead of GITHUB_TOKEN due to https://github.community/t/github-action-not-triggering-gh-pages-upon-push/16096
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        # Show alert with commit comment on detecting possible performance regression
        alert-threshold: '200%'
        comment-on-alert: true
        fail-on-alert: true

  publish:
    # Runs after the matrix jobs, so the pushes to gh-pages cannot race each other.
    name: Publish benchmark pages
    needs: benchmark
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Write the page to the branch.
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Update benchmark pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git fetch --depth=1 origin gh-pages
        git worktree add "$RUNNER_TEMP/gh-pages" FETCH_HEAD
        cp docs/benchmark-page/index.html docs/benchmark-page/ng.html "$RUNNER_TEMP/gh-pages/dev/bench/"
        cd "$RUNNER_TEMP/gh-pages"
        git add dev/bench/index.html dev/bench/ng.html
        if git diff --cached --quiet; then
          echo "The benchmark pages on gh-pages are up to date."
          exit 0
        fi
        git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -m "Update benchmark page from ${GITHUB_SHA}"
        git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
